<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#2a323d"/>
      <stop offset="0.45" stop-color="#161b22"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ff8a72"/>
      <stop offset="0.45" stop-color="#ff4655"/>
      <stop offset="1" stop-color="#b81f31"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f74e8"/>
      <stop offset="0.55" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#a9f5ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#4fd1c5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none"
        stroke="#3d4857" stroke-width="2" opacity="0.85"/>
  <rect x="16" y="16" width="224" height="224" rx="49" fill="none"
        stroke="#ffffff" stroke-width="1.5" opacity="0.045"/>

  <circle cx="128" cy="124" r="96" fill="url(#glow)"/>

  <!-- volume-knob ring with a soft highlight -->
  <circle cx="128" cy="128" r="70" fill="#0b0f14" opacity="0.55"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#ffffff" stroke-width="3"
          opacity="0.20" stroke-linecap="round"
          stroke-dasharray="118 309" transform="rotate(-168 128 128)"/>

  <!-- equalizer bars -->
  <g fill="url(#bars)">
    <rect x="71" y="100" width="14" height="56" rx="7"/>
    <rect x="96" y="82" width="14" height="92" rx="7"/>
    <rect x="121" y="66" width="14" height="124" rx="7"/>
    <rect x="146" y="88" width="14" height="80" rx="7"/>
    <rect x="171" y="106" width="14" height="44" rx="7"/>
  </g>

  <!-- LED -->
  <circle cx="183" cy="73" r="7" fill="#ff4655"/>
  <circle cx="183" cy="73" r="3" fill="#ffd9d4" opacity="0.55"/>
</svg>
